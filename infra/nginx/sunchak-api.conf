# VM(/etc/nginx/sites-available/sunchak-api)에 그대로 올리는 참고용 사본.
# certbot --nginx가 이 파일에 HTTPS 서버 블록·리다이렉트를 자동으로 덧붙이므로,
# VM을 재구성할 땐 이 원본 상태로 먼저 배치한 뒤 certbot을 실행해야 한다
# (아래 docs/STATUS.md "🚀 배포 VM 정보"의 재배포 절차 참고).
server {
    listen 80;
    server_name api.15.164.234.208.sslip.io;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE(EventSource, /reservations/:id/stream 등)가 오래 열려 있는
        # 응답이라 버퍼링/타임아웃을 완화한다 — 안 하면 Nginx가 응답을
        # 다 모을 때까지 브라우저에 안 흘려보내거나, 연결을 일찍 끊는다.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
