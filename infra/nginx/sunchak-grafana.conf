# VM(/etc/nginx/sites-available/sunchak-grafana)에 그대로 올리는 참고용 사본.
# certbot --nginx가 이 파일에 HTTPS 서버 블록·리다이렉트를 자동으로 덧붙이므로,
# VM을 재구성할 땐 이 원본 상태로 먼저 배치한 뒤 certbot을 실행해야 한다
# (아래 docs/STATUS.md "🚀 배포 VM 정보"의 재배포 절차 참고).
server {
    listen 80;
    server_name grafana.15.164.234.208.sslip.io;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Grafana 라이브 대시보드(실시간 갱신)가 내부적으로 WebSocket을 쓴다.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
